name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format (prettier gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # Project gate (AGENTS.md): src only, some tests/ files have
      # pre-existing violations.
      - run: node_modules/.bin/prettier --check "src/**/*.{ts,tsx}"

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    # Best-effort for now: strict tsc fails on this tree with pre-existing
    # errors (app.tsx, src/lib/*, src/widgets/*, plus duplicate-identifier
    # clashes between the multi-version stubs in @girs/). The signal is
    # kept visible; flip this to a required job once the tree typechecks
    # clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # typescript is deliberately not a project dependency, so install it
      # globally (pinned to major 5) — package.json/lockfile stay untouched.
      - run: npm install --global typescript@5
      - run: tsc --noEmit

  unit-tests:
    name: Unit tests (archlinux, gjs)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60
    # Best-effort: tests/run.sh needs the ags CLI and the astal typelibs
    # on the host, and none of them are in the official Arch repos — only
    # on the AUR, where the astal libs exist solely as -git packages built
    # from moving HEADs (~15 source builds per run). That path is heavy
    # and can break upstream at any time, so the job stays advisory until
    # a pinned/official install path exists.
    continue-on-error: true
    steps:
      # git is required by actions/checkout and is not in the base image.
      - name: System update + base tools
        run: pacman -Syu --noconfirm --needed git sudo base-devel go nodejs npm pnpm gjs dbus
      - uses: actions/checkout@v4
      # makepkg refuses to run as root; paru needs sudo for pacman.
      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
      - name: Install paru-bin (AUR helper, mirrors scripts/setup.sh)
        run: su builder -c "cd /tmp && git clone https://aur.archlinux.org/paru-bin.git && cd paru-bin && makepkg -si --noconfirm"
      # Package list mirrors AUR_LIBS in scripts/setup.sh, plus
      # aylurs-gtk-shell (pinned release tarball) for the ags CLI.
      - name: Install ags + astal typelibs from the AUR
        run: >
          su builder -c "paru -S --needed --refresh --noconfirm --skipreview
          aylurs-gtk-shell
          libastal-io-git libastal-4-git libastal-battery-git
          libastal-brightness-git libastal-wireplumber-git
          libastal-powerprofiles-git libastal-tray-git libastal-hyprland-git
          libastal-network-git libastal-bluetooth-git libastal-mpris-git
          libastal-notifd-git libastal-apps-git i3ipc-glib-git"
      # Mirrors link_ags_js in scripts/setup.sh (AUR installs under /usr).
      - name: Link the ags js package into .sys
        run: |
          mkdir -p .sys
          ln -sfn /usr/share/ags/js .sys/ags
          ln -sfn /usr/share/ags/js/node_modules/gnim .sys/gnim
      - name: Install node modules
        run: pnpm i --frozen-lockfile
      # The container has no session bus; give the tests a private one.
      - name: Run unit tests
        run: dbus-run-session -- bash tests/run.sh
