# wam-shell configuration
#
# Every option is commented out below — uncomment to override a default.
# Everything ships with sane defaults; an empty file is a valid config.
#
# Where the shell looks for a config file (first hit wins):
#   1. $XDG_CONFIG_HOME/wam-shell/config.toml
#   2. ~/.config/wam-shell/config.toml
#   3. <repo>/config-override.toml   (generated: this file + your values)
#   4. <repo>/config.toml            (this file)
#
# Section keys ([workspaces], [tray], ...) can also be set flat at the
# top level; the section wins when both are set. Two exceptions are
# section-only: sleep_timer.on_panel and harvest.on_panel.
#
# Environment variables do NOT expand in this file. Two env vars affect
# the shell itself:
#   WAM_SHELL_DIR      paths (scss, themes, scripts) resolve against the
#                      directory ags is started from; set this to the repo
#                      root when launching from somewhere else
#   WAM_SHELL_METRICS  set to 1 to enable the performance counters
#                      (ags request -i <instance> metrics)

# ════════════════════════════════════════════════════════════════════
# General
# ════════════════════════════════════════════════════════════════════

# instance_name - name of the ags instance, used for ags request -i and
#                 the cache dir (~/.cache/<instance_name>). recommended
#                 not to change. default "wam-shell"
# instance_name = "wam-shell"

# desktop_session_override - overrides the session detection, which
#                 normally reads $DESKTOP_SESSION. one of "hyprland",
#                 "sway", "i3". default $DESKTOP_SESSION
# desktop_session_override = "hyprland"

# os_icon - the icon in the top left. an icon name, or a file path when
#           the string contains "/" (relative paths start at the repo
#           root). unset = the LOGO from /etc/os-release, else a generic
#           missing-icon
# os_icon = ""

# theme - color theme, a file scss/theme/<name>.scss. shipped:
#         catppuccin-mocha (default), catppuccin-macchiato,
#         catppuccin-frappe, catppuccin-latte, gruvbox, gruvbox-light
# theme = "catppuccin-mocha"

# sway_gaps - the SwayGaps module (runtime-adjustable inner/outer gaps
#             via ags request). only relevant on sway/i3. default true
# sway_gaps = true

# arch_updates_threshold - minimum number of pending Arch updates before
#             the update icon shows on the panel. requires the
#             pending-updates-daemon user service (see extra/).
#             default 50
# arch_updates_threshold = 50

# ════════════════════════════════════════════════════════════════════
# Appearance — Dark Style themes, density
# ════════════════════════════════════════════════════════════════════

# Themes applied when the Dark Style quick settings toggle flips.
# Live only: the theme key above wins again on restart, unless
# follow_system is on.
#
# dark_theme - applied when Dark Style turns on. default "catppuccin-mocha"
# light_theme - applied when it turns off. default "catppuccin-latte"
# follow_system - also follow the system color scheme at startup, so
#                 Dark Style survives a shell restart. default true
# density - how much air the shell gets: "compact", "comfortable" or
#           "relaxed". default "comfortable". Scales SPACING only —
#           padding and gaps — so text and icons stay the size they
#           were; "compact" is for small screens, not for small type.
#           Changing it recompiles the stylesheet on the next start
#           (or `ags request -i wam-shell style` to apply it now).
# [appearance]
# dark_theme = "catppuccin-mocha"
# light_theme = "catppuccin-latte"
# follow_system = true
# density = "comfortable"

# ════════════════════════════════════════════════════════════════════
# Panels
# ════════════════════════════════════════════════════════════════════

# bar_monitors - monitors that get a panel. entries match the connector
#                ("HDMI-A-1"), the model ("X34 P") or a substring of the
#                description ("Acer"). unset or empty = every monitor.
#                ignored when [[panel]] blocks are defined
# bar_monitors = ["Acer X34 P"]

# bar_height - the panel's height in pixels. default 30. A MINIMUM, not
#              a cap: GTK never allocates a widget less than its content
#              needs, so a panel carrying tray icons and a 16px glyph
#              stays about 38px however small a number goes here. Raise
#              it freely; lowering it past the content does nothing
# bar_floating - detach the panel from the screen edge, so it reads as a
#                floating bar rather than a border of the screen. the
#                window keeps its full width and its exclusive zone —
#                nothing tucks in underneath. default false
# bar_float_margin - the gap that leaves, in pixels, when bar_floating is
#                on. added to the panel's height rather than taken out of
#                it, so turning floating on never shortens the strip.
#                default 6
# bar_height = 30
# bar_floating = false
# bar_float_margin = 6

# [[panel]] - multiple configurable panels
# Each [[panel]] block spawns a bar on the matching monitors with its
# own edge and widget layout. When no [[panel]] block is defined the
# classic single bar is used (and all existing settings apply).
#
# monitors - same matching as bar_monitors. empty = every monitor
# position - "top" or "bottom". default "top"
# class - extra css class on the panel window, for per-panel styling
#         in scss (e.g. class = "laptop" -> window.Bar.laptop). optional
# height - this panel's height in pixels. defaults to bar_height
# floating - detach this panel from the edge. defaults to bar_floating,
#            so one machine can float the laptop's panel and dock the
#            external monitor's
# left/center/right - widget lists. available widgets:
#                osicon, workspaces, clock, stats, tray, quicksettings,
#                language, notifications, media, sleeptimer, harvest,
#                windowtitle
#                windowtitle shows the focused window's app icon and
#                title (hyprland, sway and i3).
#                The lists are authoritative: a listed widget always
#                renders, regardless of global toggles like
#                stats_on_panel or workspaces.enabled (those only apply
#                to the classic layout). language supports hyprland,
#                sway and i3; tray renders in every panel that lists it.
# [[panel]]
# monitors = ["Acer"]
# position = "top"
# left = ["osicon", "workspaces"]
# center = ["clock"]
# right = ["stats", "tray", "quicksettings", "language", "notifications"]
#
# [[panel]]
# monitors = ["eDP-1"]
# position = "bottom"
# left = ["workspaces"]
# center = []
# right = ["notifications"]

# ════════════════════════════════════════════════════════════════════
# Bar widgets
# ════════════════════════════════════════════════════════════════════

# [workspaces] - workspace indicator (sway/i3 or hyprland)
# enabled - show the widget at all. default true
# position - "left" (next to the os icon) or "right" (right edge of the
#            tray section). default "left"
# show_icons - show per-workspace app icons. default true
# show_labels - show the workspace number/name. default true
# hide_empty - hide workspaces with no windows. the focused workspace is
#              always shown. default false
# collapse_icons - show each app icon only once per workspace, no matter
#                  how many windows of that app are open. default false
# playing_indicator - highlight workspaces holding a currently playing
#                     media player (a gently pulsing accent tint).
#                     default true
# playing_pulse_ms - pulse tempo: half a breath in milliseconds (the
#                    fade and the beat both run on it). min 200, below
#                    that it strobes. default 650
# [workspaces]
# enabled = true
# position = "left"
# show_icons = true
# show_labels = true
# hide_empty = false
# collapse_icons = false
# playing_indicator = true
# playing_pulse_ms = 650

# [tray] - system tray
# on_panel - show tray items directly on the bar instead of inside the
#            quick settings popup. default false
# spacing - horizontal gap between tray icons, in pixels. default 0
# position - "left" or "right" of the quick settings button. default
#            "left". NOTE: flat at the top level this key is
#            "tray_position" — a bare "position" would collide with
#            workspaces.position
# always_on_panel - list of app ids whose tray icons always show on the
#                   bar, even when the rest of the tray is nested.
#                   entries are matched against the SNI Id, title and
#                   icon name, and as a substring of the tooltip. use
#                   the tooltip match for Electron apps: they all report
#                   "chrome_status_icon_1" as Id with an empty title
#                   (e.g. "Connected" for Mullvad VPN). default []
# popup_icon_size - pixel size of tray icons inside the quick settings
#                   popup. the pill around them scales with it.
#                   default 22
# [tray]
# on_panel = false
# spacing = 0
# position = "left"
# always_on_panel = ["TelegramDesktop"]
# popup_icon_size = 22

# [screen_share] - the screen-share mask behind [media] and [harvest]
#        hide_when_screen_sharing. Any PipeWire video-input stream
#        (portal screencast, camera grab) counts as sharing. All keys
#        are section-only.
# ignore_apps - apps whose grabs never count as sharing, matched
#        case-insensitively against the stream's application.name and
#        node.name. For ambient screen consumers without an audience
#        (a Hue light sync), not for hiding real casts from yourself.
#        `wam screen-share` lists the names live. huenicorn is always
#        ignored, built in. default []
# [screen_share]
# ignore_apps = []

# [media] - media controls (mpris) on the panel + popup
# enabled - show the media widget in the classic (non-[[panel]]) bar
#           layout. default false. [[panel]] lists always render it
# show_controls - show prev/play/next buttons on the panel. default true
# max_width - maximum characters of the track label. default 20
# hide_when_screen_sharing - "streaming mode": while screen sharing,
#           hide the quick-settings player entirely (title, artist and
#           cover would otherwise be visible to viewers). starts the
#           screen-share monitor (pw-dump) even without the harvest
#           mask. apps in [screen_share] ignore_apps never count as
#           sharing. default false
# hide_private_sessions - hide browser private/incognito playback:
#           browsers scrub the track title to an anonymized "<X> is
#           playing media" placeholder, and such tracks are treated as
#           no track at all. default true
# recover_browser_art - chromium browsers (brave, chrome, chromium,
#           edge, vivaldi) downscale cover art to 150px before handing
#           it over, which the quick-settings backdrop then upscales
#           ~4x. With this on, the track title is looked up in the
#           browser's own history db to find the page it is playing,
#           and youtube pages give up a full-size thumbnail. Reads
#           browsing history (read-only, youtube rows only); set false
#           to leave it alone. default true
# recover_site_art - the non-youtube half of the above: the playing
#           page is found in history by the track title slugged into
#           its url, fetched, and its og:image used as the cover. Only
#           runs when recover_browser_art is on, and only for tracks
#           the youtube lookup cannot resolve. Works on
#           server-rendered pages; a js-rendered shell with no meta
#           tags still falls back to the 150px thumb. default true
# enrich_titles - a browser track with no artist metadata gets the
#           series name from the playing page's tab title: the page is
#           looked up in the browser's history (the same read-only
#           query as recover_site_art). A track titled just "Episode 1"
#           is replaced by the series name with the episode label as
#           subtitle; a real title keeps the title line and the series
#           replaces the app name on the subtitle line. default true
# [media]
# enabled = false
# show_controls = true
# max_width = 20
# hide_when_screen_sharing = false
# hide_private_sessions = true
# recover_browser_art = true
# recover_site_art = true
# enrich_titles = true

# [harvest] - Harvest time tracking (getharvest.com): running timer on
#             the panel + a picker popup (start/stop/resume/notes/new
#                         entries)
# Auth: run `wam harvest setup` — it walks you through creating a
# Personal Access Token, writes ~/.config/wam-shell/harvest.env with
# mode 600, and verifies the credentials against the API. (Manual
# alternative: put HARVEST_TOKEN and HARVEST_ACCOUNT_ID in that file
# yourself; real environment variables with the same names work too
# and win over the file.) Without credentials the widget stays off,
# even when enabled.
#
# enabled - master toggle (requires the credentials above). default true
# on_panel - show the timer on the panel: elapsed while running, the day
#            total when idle inside work hours. left-click opens the
#            picker popup, right-click stops/resumes. default true.
#            section-only key. position it like any other widget:
#            "harvest" in a [[panel]] list
# poll_interval - seconds between syncs with Harvest. the sync is a
#                 small delta query (entries updated since the last seen
#                 updated_at), usually empty; a full re-sync runs every
#                 5 min. while the session is locked the interval is
#                 60s. clamped to >= 5. default 10
# recents - recent project/task pairs listed in the picker popup's
#           Resume section. default 5
# work_start / work_end - "HH:MM". when both are set the panel widget
#           also shows while idle inside this window (dimmed, with the
#           day total). windows may wrap midnight ("22:00"-"06:00").
#           default empty = the widget only appears while a timer runs
# work_days - days the panel widget shows while idle, as a
#           comma-separated list of numeric ranges; 0=Sunday, 1=Monday
#           .. 6=Saturday ("1-5" = Mon-Fri, "6,0" = the weekend).
#           ranges may wrap the week ("5-1" = Fri,Sat,Sun,Mon). empty
#           (default) = every day. a running or paused timer always
#           shows, on any day; tracking is unaffected
# collapse_off_days - on days outside work_days, shrink the panel
#           widget to a bare icon instead of hiding it (left click
#           still opens the popup). default false
# hide_when_screen_sharing - "streaming mode": while screen sharing,
#           hide the elapsed and the pause button and mask project/task
#           (tooltip included); the pill shows only a blinking icon, so
#           viewers can't tell a timer is running. apps in
#           [screen_share] ignore_apps never count as sharing. set false
#           to disable the mask entirely — the screen-share monitor
#           (pw-dump) then never starts. default true
# notify - post a notification whenever a timer starts, pauses or
#          stops, wherever it happened: this shell, the harvest web app
#          or the phone. Starting is an acknowledgement — low urgency,
#          transient (slides away, kept out of the center's history).
#          Pausing and stopping are the ones that cost tracked time
#          when missed: critical urgency and no expiry, so they stay on
#          screen until dismissed. default true
# [harvest]
# enabled = false
# on_panel = true
# poll_interval = 10
# recents = 5
# work_start = ""
# work_end = ""
# work_days = ""
# collapse_off_days = false
# hide_when_screen_sharing = true
# notify = true

# [calendar] - Google Calendar in the clock popover: days with events
#              get a mark on the month grid, and an agenda (schedule
#              view, from the selected day onward) lists what's coming
#              with per-calendar colors. Multiple calendars and multiple
#              Google ACCOUNTS are merged into one view.
# Auth: nothing to set up — the project ships an OAuth desktop client
#       (Google treats installed-app client secrets as public). enable
#       here, restart, open the clock popover and click "Sign in to
#       Google Calendar" — a browser tab asks for read-only calendar
#       access once per account; repeat for every Google account you
#       want (the button turns into "+ Add Google account"). Refresh
#       tokens are stored in ~/.config/wam-shell/gcal-tokens.json.
#       Google's consent screen warns "unverified app" — Advanced →
#       proceed. to use your OWN client instead (no warning, no
#       test-user cap): create an OAuth client ID (type "Desktop app")
#       at console.cloud.google.com and put it in
#       ~/.config/wam-shell/google.env (chmod 600), NOT in this file:
#         GOOGLE_CLIENT_ID=...
#         GOOGLE_CLIENT_SECRET=...
#       The same names as real environment variables also work and win
#       over both the file and the embedded client.
#       WORTH DOING IF YOU RELY ON THIS: the shipped client is one Cloud
#       project shared by every install, so its quota is shared and, if
#       it is ever deleted, suspended or fails a verification review,
#       Calendar and YouTube stop working for everyone at once. Treat it
#       as a way to try the feature, not a foundation. Five minutes of
#       setup buys a dependency you control. See docs/gcal.md.
#
# enabled - master toggle (requires the credentials above). default true
# poll_minutes - minutes between syncs with Google. the popover also
#                refreshes when opened (at most once a minute). clamped
#                to >= 5. default 15
# hidden_calendars - calendar names hidden BY DEFAULT, matched exactly
#                against the names Google shows (e.g. "Birthdays",
#                "Tasks"). a bare name hides that calendar in every
#                account; "email:Name" hides it only in that account.
#                the popover's Calendars pane toggles visibility at
#                runtime (session-only, overrides this). default []
# week_numbers - show ISO-8601 week numbers down the month grid's left
#                edge. default true
# reminders - banner reminders for timed events, and list today's and
#                tomorrow's events in the notification center (a calendar
#                icon in its header filters to just them; in-progress and
#                starting-soon events sit in the "Needs you" zone). the
#                banner fires at the event's own Google reminder times
#                (per-event overrides, else the calendar's defaults) and
#                again when the event starts; it is critical — it never
#                auto-hides and breaks through DND, like an alarm clock.
#                events Google explicitly marks reminder-less stay silent;
#                hidden calendars and all-day events never banner.
#                default true
# remind_before_minutes - fallback lead time for events that carry NO
#                reminder information at all. default 10
# remind_only_attending - banner only for events you actually take part
#                in: your email is on the guest list (and you haven't
#                declined), you organized it, or it's a personal event
#                on your own primary calendar. events a shared calendar
#                merely SHOWS still list in the notification center,
#                they just don't banner. default true
# [calendar]
# enabled = false
# poll_minutes = 15
# hidden_calendars = []
# week_numbers = true
# reminders = true
# remind_before_minutes = 10
# remind_only_attending = true

# [github] - GitHub notifications inside the notification center: your
#            unread GitHub inbox merges into the center's list, and a
#            GitHub icon in the center's header filters to just them.
#            clicking an item opens the thread in the browser (and
#            marks it read); dismissing an item marks it done on
#            GitHub (recoverable via the Done filter on github.com)
# Auth: create a personal access token (github.com/settings/tokens):
#       a fine-grained token with Notifications read access, or a
#       classic token with the "notifications" scope. Put it in
#       ~/.config/wam-shell/github.env (chmod 600), NOT in this file:
#         GITHUB_TOKEN=...
#       The same name as a real environment variable also works and
#       wins over the file. Without a token the center shows desktop
#       notifications only, even when enabled.
#
# enabled - master toggle (requires the token above). default true
# poll_minutes - minutes between inbox syncs. the center also refreshes
#                when opened (at most once a minute). re-polls are
#                conditional (If-Modified-Since) and rate-limit free.
#                clamped to >= 1. default 5
# [github]
# enabled = false
# poll_minutes = 5

# [todoist] - Todoist tasks in the notification center: SCHEDULED
#             tasks (due at a concrete time today or tomorrow)
#             merge into the center's list, soonest first, and a
#             Todoist icon in the header filters to just them.
#             clicking an item opens the task in the browser;
#             dismissing an item COMPLETES the task on Todoist.
#             all-day and overdue tasks are not listed: the provider
#             is about time-critical tasks, not historical records
# Auth: copy your API token from Todoist settings (Integrations →
#       Developer) and put it in ~/.config/wam-shell/todoist.env
#       (chmod 600), NOT in this file:
#         TODOIST_API_TOKEN=...
#       The same name as a real environment variable also works and
#       wins over the file. Without a token the provider stays off,
#       even when enabled.
#
# enabled - master toggle (requires the token above). default true
# poll_minutes - minutes between syncs. the center also refreshes when
#                opened (at most once a minute). clamped to >= 1.
#                default 5
# reminders - raise banners for a scheduled task: once at its own
#             Todoist reminder time and again at the due moment.
#             banners are high priority and stay until dismissed.
#             default true
# remind_before_minutes - fallback banner time for tasks WITHOUT a
#             Todoist reminder of their own: this many minutes before
#             due. default 5
# snooze_minutes - the banner's Postpone button: re-raise it this many
#             minutes later (capped at the task's due time). Local only:
#             the task's due time on Todoist is never changed. default 30
# [todoist]
# enabled = false
# poll_minutes = 5
# reminders = true
# remind_before_minutes = 5
# snooze_minutes = 30

# [protonmail] - ProtonMail unread mail in the notification center, via
#             ProtonMail Bridge's local IMAP: the unread INBOX merges
#             into the center's list (newest first, sender + subject),
#             and a ProtonMail icon in the header filters to just them.
#             clicking an item opens webmail; dismissing marks the mail
#             SEEN on the bridge
# Requires: protonmail-bridge installed, running, and signed in (the
#       bridge app shows the IMAP username and bridge password under
#       Mailbox details). Put them in ~/.config/wam-shell/protonmail.env
#       (chmod 600), NOT in this file:
#         PROTONMAIL_IMAP_USER=...
#         PROTONMAIL_IMAP_PASSWORD=...
#       The same names as real environment variables also work and win
#       over the file. Without credentials the provider stays off, even
#       when enabled.
#
# enabled - master toggle (requires the credentials above). default true
# poll_minutes - minutes between syncs. the center also refreshes when
#                opened (at most once a minute). clamped to >= 1.
#                default 2
# host - bridge IMAP host. default "127.0.0.1"
# port - bridge IMAP port. default 1143
# tls - speak STARTTLS before logging in. default false.
#       IMAP LOGIN sends the bridge password in the CLEAR. On 127.0.0.1
#       that is a hop between two of your own processes and is how the
#       bridge is meant to be used, so the default is off. Point `host`
#       at another machine and the same password crosses a network, so
#       the provider REFUSES to start there unless this is true — it
#       will not quietly transmit it. A server that then declines
#       STARTTLS is an error, never a downgrade to cleartext.
# tls_insecure - accept the bridge's certificate without verifying it.
#       default false. Proton Mail Bridge signs its own certificate, so
#       a strict handshake against a remote bridge fails; this makes it
#       succeed. It still keeps the password off the wire, but it does
#       NOT prove you are talking to your bridge — only use it on a
#       network you trust.
# [protonmail]
# enabled = false
# poll_minutes = 2
# host = "127.0.0.1"
# port = 1143
# tls = false
# tls_insecure = false

# [youtube] - YouTube notifications in the notification center: new
#             uploads from your subscriptions (the YouTube home feed)
#             merge into the center's list with thumbnails, and a
#             YouTube icon in the header filters to just them. clicking
#             an item opens the video; dismissing hides it locally
#             (YouTube has no read/done API). Note: comments/replies
#             are not available via any API.
# Auth: the same Google OAuth client as [calendar] — zero setup. one
#       browser consent per Google account (the center's YouTube filter
#       shows a "Sign in to YouTube" button until then). First-time
#       maintainer setup (already done for this project): enable
#       "YouTube Data API v3" and add the youtube.readonly scope on the
#       OAuth consent screen. Tokens live in
#       ~/.config/wam-shell/youtube-tokens.json.
#
# enabled - master toggle. default false
# poll_minutes - minutes between syncs. each sync fetches the uploads
#                playlist of every subscribed channel (~1 quota unit
#                per subscription: the default 10k/day fits ~275
#                subscriptions hourly). the provider raises the
#                effective interval when your subscription count would
#                exceed the quota. clamped to >= 15. default 60
# [youtube]
# enabled = false
# poll_minutes = 60
# ════════════════════════════════════════════════════════════════════
# Quick settings popup
# ════════════════════════════════════════════════════════════════════

# [quicksettings]
# show_battery_percentage - show the battery percentage next to the
#                     battery icon on the panel. default true
# show_device_names - overlay the active input/output device name on
#                     the volume sliders. default false
# show_stats - show the performance stats tiles (cpu/ram/gpu/network)
#              in the power mode pane. collected only while the pane is
#              open. default false
# stats_on_panel - show the resource utilization monitor (cpu/ram/gpu
#                  percentages) on the panel. default false
# stats_interval - milliseconds between stat updates. lower = smoother
#                  graphs, higher cpu cost. default 1000
# power_profile_on_panel - show the active power profile icon in the
#                          bar's quicksettings label. default true
# hide_on_media_play - close the popup when a player starts playing
#                      (pressing play in the media section, or a video
#                      starting anywhere else). pausing leaves it open.
#                      default true
# audio_meter - draw a playback level bar under the default output
#               device in the audio pane, so you can see how loud the
#               sound actually is against the volume you set. reading a
#               level needs a capture client (a gstreamer pipeline on
#               the sink's monitor), which runs only while that pane is
#               open. default true
# mic_meter - the same level bar under the default input device in the
#             audio pane. this one opens the microphone while the Input
#             pane is on screen (and only then) — set false to keep the
#             output meter without the shell ever listening. default true
# min_height - the popup never shrinks below this many px when you
#              switch to a short pane (vpn, wired), so navigating
#              settles it instead of yanking it. 0 (default) holds a
#              short pane at the main pane's own height — the size you
#              opened at, whatever it happens to be. Set a number only
#              to hold short panes TALLER than that; it never pads the
#              main pane itself
# show_avatar - show the avatar in the popup header. default true
# width - popup content width in px. default 440 (the pre-config value
#         was 520; raise it back if you liked the wide layout)
# avatar - absolute path to the avatar image. square crop recommended,
#          ~96x96px (resize with scripts/prepare-avatar.sh). empty
#          (default) = the login avatar from AccountsService, falling
#          back to the OS icon
# battery_full_at - charge cap in percent; the header ring treats this
#                   as full. default: auto-detected from sysfs
#                   (charge_control_end_threshold) when exposed, else
#                   100. set explicitly to override
# [quicksettings]
# width = 440
# show_battery_percentage = true
# show_device_names = false
# show_stats = false
# stats_on_panel = false
# stats_interval = 1000
# power_profile_on_panel = true
# hide_on_media_play = true
# audio_meter = true
# mic_meter = true
# min_height = 0
# show_avatar = true
# avatar = ""
# battery_full_at = 100

# [netstats] - cumulative bandwidth totals (down/up per day, kept 90
#              days in ~/.cache/<instance>/netstats.json). unlike the
#              live rate in the stats widgets, totals are collected
#              around the clock — one /proc/net/dev read every 15s
# enabled - track totals at all; false also hides the quick settings
#           tiles and empties the bar module. default true
# on_panel - show today's download total on the panel (legacy layout;
#            with [[panel]] lists, add "netstats" to a list instead).
#            default false
# [netstats]
# enabled = true
# on_panel = false

# [bluetooth] - bluetooth quick settings pane
# notifications - send a notification when a device connects/disconnects
#                 or reports low battery (<= 20%). default true
# [bluetooth]
# notifications = true

# [sleep_timer] - quick settings sleep timer (pauses all playing media
#                 after the picked duration). running and paused timers
#                 survive shell restarts (state in
#                 $XDG_RUNTIME_DIR/wam-shell/sleep-timer.json; gone on
#                 reboot). a timer that expires while the shell is down
#                 does NOT fire retroactively: you get one notification
#                 that it expired instead
# enabled - show the sleep timer toggle in quick settings. default true
# presets - preset durations in minutes shown in the dropdown. custom
#           values can always be typed in the entry. must be a non-empty
#           list of positive numbers. default [10, 15, 20, 30, 45, 60]
# time_format - how the entry reads clock times. the entry takes either
#               a duration in minutes ("45") or a time of day ("23:30"),
#               told apart by the colon. a time of day always resolves
#               FORWARDS: one that has already passed today means
#               tomorrow.
#               "24h" (default) reads 7:30 as the morning; "12h" reads a
#               bare 7:30 as whichever of 07:30/19:30 comes first, and
#               shows an am/pm example in the placeholder; "auto" picks
#               between them from the system locale. an explicit am/pm
#               ("11:30 pm") is always honoured whatever this is set to
# on_panel - show the countdown on the panel while a timer runs. click
#            it to pause/resume. default true. section-only key.
#            position it like any other widget: "sleeptimer" in a
#            [[panel]] list
# dim - when the timer fires, dim the screen. the pre-dim level also
#       persists across restarts, so extending afterwards always
#       restores. default true
# dim_level - the dim target as a fraction of the current brightness.
#             0.4 = default, 0.25 = quarter
# dim_floor - absolute minimum the dim never goes below. default 0.15
# alarm - when the timer reaches 0, play a soft chime (assets/
#         sleep-alarm.ogg) in a loop until stopped from the pill. the
#         sink is raised to alarm_volume and unmuted while it rings,
#         then restored. this key is only the default for the pill's
#         checkbox; the checkbox itself is consulted at fire time and
#         persists across restarts (cache dir). default false
# alarm_volume - the volume the sink is raised to while the alarm
#                rings, as a percentage (100 = full). only raises,
#                never lowers a louder sink. default 80
# restore_on_play - when media starts playing after the timer fired,
#                   also restore the pre-dim brightness (starting to
#                   play always lifts the timer's mutes). like alarm,
#                   only the default for the pill's checkbox. default
#                   false
# alarm_only - an alarm is a reminder: when the chime rings, nothing is
#              paused, muted or dimmed (an alarm should not silence the
#              machine it is waking you with). with the alarm checkbox
#              off, the timer is a plain sleep timer again — pause,
#              mute and dim, no sound. set false to get both at once:
#              the sleep actions AND the chime. default true
#              NOTE: with the alarm on, the pill also offers a text
#              field — whatever is typed there is shown as a
#              notification at 0, posted with critical urgency and
#              never expiring on its own, so it stays until dismissed.
#              no config key (it is a per-timer message, not a
#              setting); empty, or the alarm off, = no notification
# [sleep_timer]
# enabled = true
# presets = [10, 15, 20, 30, 45, 60]
# time_format = "24h"
# on_panel = true
# dim = true
# dim_level = 0.4
# dim_floor = 0.15
# alarm = false
# alarm_volume = 80
# restore_on_play = false
# alarm_only = true

# ════════════════════════════════════════════════════════════════════
# Notifications
# ════════════════════════════════════════════════════════════════════

# [notifications] - notification banners + center
# daemon - whose notification daemon is used:
#          "auto" (default) - the system's daemon if one is already
#          running (swaync, dunst, ...), ours if none is
#          "wam-shell" - force ours (note: if another daemon already
#          owns the bus name, notifications still go to it)
#          "system" - force the system's, even when none is running
#          (nothing will display notifications in that case)
#          decided at startup; restart the shell after changing daemons
# popups - show transient banners (card with a countdown bar) for
#          incoming notifications. they follow the focused monitor,
#          freeze on hover, and respect do-not-disturb (critical still
#          breaks through). only shown when our daemon is used.
#          default true
# popup_timeout - milliseconds before a popup hides itself, used when
#                 the notification does not ask for a length of its own.
#                 a sender's expire_timeout wins: 0 keeps the banner up
#                 until dismissed, any positive value is honoured as-is.
#                 when the sender defers (-1), this applies — low urgency
#                 drains in half the time, critical stays until
#                 dismissed. default 5000
# position - where banners appear: "topRight" or "topCenter".
#            default "topRight"
# popup_width - fixed banner width in pixels. the whole stack is the
#               same width and does not resize as notifications arrive
#               and expire. default 460
# transient_apps - list of app names whose notifications are popup-only:
#                  shown as banners but excluded from the center's
#                  history (attention-only events you never consult
#                  later). matched case-insensitively against the app
#                  name. notifications carrying the spec "transient"
#                  hint (e.g. wam-shell's own bluetooth
#                  connect/disconnect) are always excluded, regardless
#                  of this list. default []
# popup_providers - list of provider names ("github", "youtube", ...)
#                  whose items may also raise transient banners,
#                  alongside the center. empty (default) = provider
#                  notifications live in the center only. banners
#                  respect do-not-disturb; the first sync after startup
#                  is a silent baseline
# [notifications]
# daemon = "auto"
# popups = true
# popup_timeout = 5000
# position = "topRight"
# popup_width = 460
# transient_apps = ["Spotify"]
# popup_providers = []

# ════════════════════════════════════════════════════════════════════
# Keep awake (idle inhibitor)
# ════════════════════════════════════════════════════════════════════

# The "Keep Awake" quick settings toggle, the bar's cup indicator and
# the `keep-awake` request command all drive this. By default it takes a
# logind inhibitor lock ("idle:sleep", mode "block") — no helper process,
# and it is released automatically if the shell ever dies.
#
# That covers logind's own idle actions and hypridle (which honours
# systemd inhibitors unless you set ignore_systemd_inhibit). swayidle
# does NOT look at logind inhibitors: on sway, point `command` at
# something that speaks the Wayland idle-inhibit protocol instead.
#
# command - run this instead of taking the lock. It is started when keep
#           awake goes on and killed when it goes off, so it must BLOCK
#           for as long as it should inhibit. default [] (use the lock)
# [idle_inhibit]
# command = ["wlinhibit"]
# command = ["systemd-inhibit", "--what=idle", "--who=wam-shell", "--why=Keep awake", "sleep", "infinity"]

# ════════════════════════════════════════════════════════════════════
# On-screen display
# ════════════════════════════════════════════════════════════════════

# [osd] - on-screen display for volume/mic/brightness/lock-key/layout
#         changes
# enabled - default true
# position - "bottom", "center" or "top". default "bottom"
# margin - pixels between the OSD and the edge it is anchored to.
#          default 140, which clears the message composer of a
#          bottom-docked chat app (the old fixed 60 sat on top of
#          slack's input). ignored when position = "center"
# timeout - milliseconds before the OSD hides. default 2000. this is
#           the duration for the pills you DRIVE (volume, microphone,
#           brightness); the ones that just announce a state get a
#           fraction of it, since they are read in a glance: layout
#           30%, lock keys 60% (600ms and 1200ms at the default)
# timeout_volume, timeout_microphone, timeout_brightness,
# timeout_layout, timeout_lock_keys -
#           pin one kind's duration in milliseconds instead of
#           deriving it from timeout
# volume, microphone, brightness, layout, lock_keys -
#           per-trigger toggles. default true
# [osd]
# enabled = true
# position = "bottom"
# margin = 140
# timeout = 2000
# timeout_layout = 600
# timeout_lock_keys = 1200
# volume = true
# microphone = true
# brightness = true
# layout = true
# lock_keys = true

# ════════════════════════════════════════════════════════════════════
# Night light (hyprsunset, hyprland only)
# ════════════════════════════════════════════════════════════════════

# [hyprsunset]
# temperature_default - color temperature in kelvin used normally
#                       (night light off, gamma at or below 100%).
#                       default 6000
# temperature_outdoor - color temperature applied in outdoor mode
#                       (gamma above 100%). falls back to
#                       temperature_default when omitted
# night_temp - color temperature when night light is on. default 4000
# gamma_outdoor - gamma in outdoor mode, in percent. may exceed 100.
#                 default 150
# [hyprsunset]
# temperature_default = 6000
# temperature_outdoor = 7200
# night_temp = 4000
# gamma_outdoor = 150
