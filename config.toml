# wam-shell configuration
# Enviroemntal variables don't work. here. if a environmental variable is
# mentioned to default or specifically specified that will work with
# environmental variables
#
# Paths (scss, themes, scripts) resolve against the directory ags is
# started from. Set WAM_SHELL_DIR to the repo root when launching from
# somewhere else.

# Name of the instance, defaults to wam-shell, Recommended not to change
# instance_name = "wam-shell"

# Desktop session override, overrides the desktop session, Normally picks up
# $DESKTOP_SESSION variable. sway - i3 - hyprland. defaults to $DESKTOP_SESSION,
# desktop_session_override = "hyprland"

# os_icon
# The icon in the topleft, can be a file or a icon name. File will be used if
# string contains "/" otherwise icon is used. can also use relative paths,
# relative paths start at the project root / instanceSrcDir. If left undefined
# will resolve icon from /etc/os-release, if that fails will be empty string and
# missing-icon is used.
# os_icon = ""

# sway_gaps - SwayGaps module
# Enable sway_gaps feature, Defaults to true if desktop session is sway.
# otherwise disabled
# sway_gaps = true

# theme - color theme, a file in scss/theme/<name>.scss. shipped:
#         catppuccin-mocha (default), catppuccin-macchiato,
#         catppuccin-frappe, catppuccin-latte, gruvbox, gruvbox-light
# theme = "catppuccin-mocha"

# [appearance] - themes applied when the Dark Style quick settings
#                toggle flips (the shell follows the app's color
#                scheme). live only: the theme key above wins again on
#                restart
# dark_theme - applied when Dark Style turns on. default
#              "catppuccin-mocha"
# light_theme - applied when it turns off. default "catppuccin-latte"
# [appearance]
# dark_theme = "catppuccin-mocha"
# light_theme = "catppuccin-latte"

# bar_monitors - list of monitors that get a panel. Entries match the
#                connector ("HDMI-A-1"), the model ("X34 P") or a
#                substring of the description ("Acer"). Unset or empty
#                list shows the panel on every monitor.
#                Ignored when [[panel]] blocks are defined.
# bar_monitors = ["Acer X34 P"]

# [[panel]] - multiple configurable panels
# Each [[panel]] block spawns a bar on the matching monitors with its
# own edge and widget layout. When no [[panel]] block is defined the
# classic single bar is used (and all existing settings apply).
#
# monitors - same matching as bar_monitors. empty = every monitor
# position - "top" or "bottom". default "top"
# class - extra css class on the panel window, for per-panel styling
#         in scss (e.g. class = "laptop" -> window.Bar.laptop). optional
# left/center/right - widget lists. Available widgets:
#                osicon, workspaces, clock, stats, tray, quicksettings,
#                language, notifications, media, sleeptimer
#                The lists are authoritative: a listed widget always
#                renders, regardless of global toggles like
#                stats_on_panel or workspaces.enabled (those only apply
#                to the classic layout). language supports hyprland,
#                sway and i3; tray renders in every panel that lists it.
# [[panel]]
# monitors = ["Acer"]
# position = "top"
# left = ["osicon", "workspaces"]
# center = ["clock"]
# right = ["stats", "tray", "quicksettings", "language", "notifications"]
#
# [[panel]]
# monitors = ["eDP-1"]
# position = "bottom"
# left = ["workspaces"]
# center = []
# right = ["notifications"]

# [workspaces] - Workspace indicator widget
# Shows the workspace indicator for the running session (sway/i3 or hyprland)
# Keys can be set inside a [workspaces] section or flat at the top level
# (like the rest of this file). The section takes precedence if both are set.
#
# enabled - show the widget at all. default true
# position - "left" (next to the os icon) or "right" (right edge of the
#            tray section). default "left"
# show_icons - show per-workspace app icons. default true
# show_labels - show the workspace number/name. default true
# hide_empty - hide workspaces with no windows. the focused workspace is
#              always shown. default false
# collapse_icons - show each app icon only once per workspace, no matter how
#                  many windows of that app are open. default false
# [workspaces]
# enabled = true
# position = "left"
# show_icons = true
# show_labels = true
# hide_empty = true
# collapse_icons = false

# [tray] - System tray widget
# Keys can be set inside a [tray] section or flat at the top level.
#
# on_panel - show tray items directly on the bar instead of inside the
#            quick settings popup. default false
# spacing - horizontal gap between tray icons, in pixels. default 0
# position - "left" or "right" of the quick settings button. default "left"
#            NOTE: flat at the top level this key is "tray_position", a
#            bare "position" would collide with workspaces.position
# always_on_panel - list of app ids whose tray icons always show on the
#                   bar, even when the rest of the tray is nested. entries
#                   are matched against the SNI Id, title and icon name,
#                   and as a substring of the tooltip. use the tooltip
#                   match for Electron apps, they all report
#                   "chrome_status_icon_1" as Id with an empty title
#                   (e.g. "Connected" for Mullvad VPN).
#                   default []
# popup_icon_size - pixel size of tray icons inside the quick settings
#                   popup. the pill around them scales with it.
#                   default 22
# [tray]
# on_panel = false
# spacing = 0
# position = "left"
# always_on_panel = ["TelegramDesktop"]
# popup_icon_size = 22

# [quicksettings] - Quick settings popup
# Keys can be set inside a [quicksettings] section or flat at the top level.
#
# close_delay - milliseconds after the pointer leaves the popup before it
#               closes. default 350
# show_battery_percentage - show the battery percentage next to the battery
#                           icon on the panel. default true
# show_device_names - overlay the active input/output device name on the
#                     volume sliders. default false
# show_stats - show the performance stats section (cpu/ram/gpu/network)
#              in the popup. default false
# stats_on_panel - show the resource utilization monitor (cpu/ram/gpu
#                  percentages) on the panel. default false
# stats_interval - milliseconds between stat updates. lower = smoother
#                  graphs, higher cpu cost. default 1000
# [quicksettings]
# close_delay = 350
# show_battery_percentage = true
# show_device_names = false
# show_stats = false
# stats_on_panel = false
# stats_interval = 1000

# [bluetooth] - bluetooth quick settings pane
# notifications - send a notification when a device connects/disconnects
#                 or reports low battery (<= 20%). default true
# [bluetooth]
# notifications = true

# [notifications] - notification banners + center
# daemon - whose notification daemon is used:
#          "auto" (default) - the system's daemon if one is already
#          running (swaync, dunst, ...), ours if none is
#          "wam-shell" - force ours (note: if another daemon already
#          owns the bus name, notifications still go to it)
#          "system" - force the system's, even when none is running
#          (nothing will display notifications in that case)
#          decided at startup; restart the shell after changing daemons
# popups - show transient banners (pill with countdown ring) for incoming
#          notifications. they follow the focused monitor, freeze and
#          unfold on hover, and respect do-not-disturb (critical still
#          breaks through). only shown when our daemon is used.
#          default true
# popup_timeout - milliseconds before a popup hides itself. low urgency
#                 drains in half the time; critical stays until dismissed.
#                 default 5000
# position - where banners appear: "topRight" or "topCenter".
#            default "topRight"
# popup_width - fixed banner width in pixels. the whole stack is the
#               same width and does not resize as notifications arrive
#               and expire. default 460
# [notifications]
# daemon = "auto"
# popups = true
# popup_timeout = 5000
# position = "topRight"
# popup_width = 460

# [media] - panel media controls (mpris) + popup
# enabled - show the media widget in the legacy (non-[[panel]]) bar
#           layout. default false. panel lists always render it
# show_controls - show prev/play/next buttons on the panel. default true
# max_width - maximum characters of the track label. default 20
# [media]
# enabled = false
# show_controls = true
# max_width = 20

# temperature_default - color temperature in kelvin used normally (night
#                       light off, gamma at or below 100%). default 6000
# temperature_outdoor - color temperature applied in outdoor mode (gamma
#                       above 100%). falls back to temperature_default
#                       when omitted
# night_temp - color temperature when night light is on. default 4000
# gamma_outdoor - gamma in outdoor mode, in percent. may exceed 100.
#                 default 150
# temperature_default = 6000
# temperature_outdoor = 7200
# night_temp = 4000
# gamma_outdoor = 150

# [osd] - on-screen display for volume/mic/brightness/lock-key/layout
#         changes
# enabled - default true
# position - "bottom", "center" or "top". default "bottom"
# timeout - milliseconds before the OSD hides. default 2000
# volume, microphone, brightness, layout, lock_keys, media - per-trigger
#           toggles. default true
# [osd]
# enabled = true
# position = "bottom"
# timeout = 2000
# volume = true
# microphone = true
# brightness = true
# layout = true
# lock_keys = true
# media = true

# arch_updates_threshold - Check updates module
# The minimum amount of updates required to show a update icon.
# arch_updates_threshold = 50
# [sleep_timer] - quick settings sleep timer (pauses all playing media
#                 after the picked duration)# enabled - show the sleep timer toggle in quick settings. default true
# presets - preset durations in minutes shown in the dropdown. custom
#           values can always be typed in the entry. must be a
#           non-empty list of positive numbers.
#           default [10, 15, 20, 30, 45, 60]
# on_panel - show the countdown on the panel while a timer runs.
#            click it to pause/resume. default true. position it like
#            any other widget: "sleeptimer" in a [[panel]] list
# dim - when the timer fires, dim the screen to half its current
#       brightness (never below 10%). default true
# [sleep_timer]
# enabled = true
# presets = [10, 15, 20, 30, 45, 60]
# on_panel = true
# dim = true
